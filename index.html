<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remy Lawyer | Networking & Cloud Portfolio</title>
<meta name="description" content="Portfolio of Remy Lawyer, Advanced Networking & Cloud Engineering student. Plug the cable into a port to open a section.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="closet" id="closet">
  <aside class="visitor">
    <div class="laptop" aria-hidden="true"><span>Visitor laptop</span><i id="nic"></i></div>
    <div class="who">
    <img class="me" src="assets/remy.jpg" alt="Portrait of Remy Lawyer" width="112" height="112">
    <h1>Remy Lawyer</h1>
    <p>Advanced Networking & Cloud Engineering student. Gold Coast, QLD.</p>
    </div>
  </aside>
  <section class="rack" aria-label="Network rack. Plug the cable into a patch panel port to open a section">
    <div class="unit patch"><h2>Patch panel</h2><div class="ports" id="ports"></div></div>
    <div class="unit sw"><h2>RL-SW12 Gigabit switch</h2><div class="swports" id="sw"></div></div>
    <div class="display" id="screen" aria-live="polite">
      <div class="status" id="status"></div>
      <div class="view" id="view"></div>
    </div>
  </section>
  <svg class="cables" id="cables" aria-hidden="false">
    <path id="shadow" class="shadow"/><path id="cable" class="cable"/>
    <g id="plug" tabindex="0" role="button" aria-label="Network cable. Drag to a port, or use the left and right arrow keys to move between ports.">
      <g class="wig"><rect class="housing" x="-13" y="-20" width="26" height="30" rx="3"/>
      <path class="pins" d="M-8-20v7M-4-20v7M0-20v7M4-20v7M8-20v7"/><rect class="boot" x="-10" y="10" width="20" height="14" rx="3"/></g>
    </g>
  </svg>
</main>
<noscript><p style="padding:24px">This portfolio uses JavaScript. Resume PDF: <a href="resume/Remy_Lawyer_Resume.pdf">download</a>.</p></noscript>
<script src="js/app.js"></script>
</body>
</html>
